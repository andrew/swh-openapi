        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginSave'
            application/yaml:
              schema:
                $ref: '#/components/schemas/OriginSave'
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
        '400':
