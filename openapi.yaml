      summary: Get a list of all revisions heading to a given one, in other words show the commit log
      description: Get a list of all revisions heading to a given one, in other words show the commit
        log. The revisions are returned in the breadth-first search order while visiting the revision
        graph. The number of revisions to return is also bounded by the limit query parameter. To get
        the full BFS traversal of the revision graph when the total number of revisions is greater than
        1000, it is up to the client to keep track of the multiple branches of history when there's merge
        revisions in the returned objects. In other words, identify all the continuation points that need
        to be followed to get the full history through recursion.
      tags:
      - Archive
      parameters:
      - name: sha1_git
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f]+'
        description: hexadecimal representation of the revision sha1_git identifier
        example: e1a315fa3fa734e2a6154ed7b5b9ae0eb8987aad
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
            application/yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
        '400':
          description: an invalid sha1_git value has been provided
        '404':
          description: head revision cannot be found in the archive
      x-swh-doc-route: /api/1/revision/log/
