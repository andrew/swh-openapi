  /api/1/extid/{extid_type}/{extid_format}:{extid}/:
    get:
      operationId: api-1-extid
      summary: Get information about an external identifier
      description: 'Get information about an external identifier. An external identifier is used by a
        system that does not fit the Software Heritage data model. As an external identifier is stored
        in binary into the archive database, the format used to decode its ASCII representation must be
        explicitly specified. The available formats are the following: * base64url: the external identifier
        is encoded to base64url. * hex: the external identifier is a checksum in hexadecimal representation
        * raw: the external identifier is an ASCII string The types of external identifier that can be
        requested are given below. VCS related: * bzr-nodeid: Revision ASCII identifier of a Bazaar repository,
        to get such identifiers use the following command in your Bazaar repository: bzr log --show-ids.
        * hg-nodeid: Node hash identifier for the revision of a Mercurial repository, to get such identifier
        execute the following command in your Mercurial repository: hg id -r <rev_num> --template ''{node}''.
        Guix and Nix related (must be queried with the extid_version query parameter set to 1 to ensure
        correctness): * nar-sha256: sha256 checksum of a Nix Archive (NAR), used to deterministically
        identifies the contents of a source tree (corresponds to *recursive* hash mode used by Guix and
        Nix) * checksum-sha256: sha256 checksum of a file, typically a tarball (corresponds to *flat*
        hash mode used by Guix and Nix) * checksum-sha512: sha512 checksum of a file, typically a tarball
        (corresponds to *flat* hash mode used by Guix and Nix)'
      tags:
      - External IDentifiers
      parameters:
      - name: extid_type
        in: path
        required: true
        schema:
          type: string
        description: the type of external identifier
        example: checksum-sha512
      - name: extid_format
        in: path
        required: true
        schema:
          type: string
        description: the format used to encode the extid to an ASCII string, either base64url, hex or
          raw
        example: base64url
      - name: extid
        in: path
        required: true
        schema:
          type: string
        description: the external identifier value
        example: AL5bxZ-gStT5UpzSc1dN-XVxxWN9FHtvBlZoFeFFMowwgMKWq9GLZHV8DWX-g7ugiKxlKa2ph2oTQCqvhixDQw/
      - name: extid_version
        in: query
        required: false
        schema:
          type: integer
        description: optional version number of external identifier type
        example: '1'
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtidTarget'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ExtidTarget'
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
        '404':
          description: requested external identifier cannot be found
      x-swh-doc-route: /api/1/extid/
