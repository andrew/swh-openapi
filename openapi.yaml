  /api/1/origin/save/:
    get:
      operationId: api-1-save-origin
      summary: Request the saving of a software origin into the archive or check the status of previously
        created save requests
      description: 'Request the saving of a software origin into the archive or check the status of previously
        created save requests. That endpoint enables to create a saving task for a software origin through
        a POST request. Depending of the provided origin url, the save request can either be: * immediately
        accepted, for well known code hosting providers like for instance GitHub or GitLab * rejected,
        in case the url is blocked by Software Heritage * put in pending state until a manual check is
        done in order to determine if it can be loaded or not Once a saving request has been accepted,
        its associated saving task status can then be checked through a GET request on the same url. Returned
        status can either be: * not created: no saving task has been created * pending: saving task has
        been created and will be scheduled for execution * scheduled: the task execution has been scheduled
        * running: the task is currently executed * succeeded: the saving task has been successfully executed
        * failed: the saving task has been executed but it failed When issuing a POST request an object
        will be returned while a GET request will return an array of objects (as multiple save requests
        might have been submitted for the same origin). It is also possible to get info about a specific
        save request by sending a GET request to the /api/1/origin/save/(request_id)/ endpoint. If the
        origin URL contains special characters like a white space or a question mark (meaning the URL
        has query parameters), you should rather pass the percent encoded origin_url and visit_type values
        through query parameters instead of URL arguments.'
      tags:
      - Request archival
      parameters:
      - name: visit_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - archives
          - bzr
          - cvs
          - git
          - hg
          - svn
          - tarball
      - name: origin_url
        in: query
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginSave'
            application/yaml:
              schema:
                $ref: '#/components/schemas/OriginSave'
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
        '400':
          description: an invalid visit type or origin url has been provided
        '403':
          description: the provided origin url is blocked
        '404':
          description: no save requests have been found for a given origin
      x-swh-doc-route: /api/1/origin/save/
    post:
      operationId: api-1-save-origin-post
      summary: Request the saving of a software origin into the archive or check the status of previously
        created save requests
      description: 'Request the saving of a software origin into the archive or check the status of previously
        created save requests. That endpoint enables to create a saving task for a software origin through
        a POST request. Depending of the provided origin url, the save request can either be: * immediately
        accepted, for well known code hosting providers like for instance GitHub or GitLab * rejected,
        in case the url is blocked by Software Heritage * put in pending state until a manual check is
        done in order to determine if it can be loaded or not Once a saving request has been accepted,
        its associated saving task status can then be checked through a GET request on the same url. Returned
        status can either be: * not created: no saving task has been created * pending: saving task has
        been created and will be scheduled for execution * scheduled: the task execution has been scheduled
        * running: the task is currently executed * succeeded: the saving task has been successfully executed
        * failed: the saving task has been executed but it failed When issuing a POST request an object
        will be returned while a GET request will return an array of objects (as multiple save requests
        might have been submitted for the same origin). It is also possible to get info about a specific
        save request by sending a GET request to the /api/1/origin/save/(request_id)/ endpoint. If the
        origin URL contains special characters like a white space or a question mark (meaning the URL
        has query parameters), you should rather pass the percent encoded origin_url and visit_type values
        through query parameters instead of URL arguments.'
      tags:
      - Request archival
      parameters:
      - name: visit_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - archives
          - bzr
          - cvs
          - git
          - hg
          - svn
          - tarball
      - name: origin_url
        in: query
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: false
