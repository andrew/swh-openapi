      summary: Request the cooking of a git-bare archive or check its cooking status
      description: 'Request the cooking of a git-bare archive or check its cooking status. That endpoint
        enables to create a git-bare archive cooking task for a: * revision: produced repository only
        includes a single branch heading to the revision * release: produced repository only includes
        a single branch heading to the release * snapshot: produced repository includes all branches and
        releases contained in the snapshot * directory: produced repository only includes a single branch
        with a single commit targeting the directory A cooking task must be created through a POST request
        while checking the status of a previously created one can be done through a GET request. Once
        the cooking task has been executed, the resulting git-bare archive can be downloaded using the
        dedicated endpoint /api/1/vault/git-bare/raw/: :: $ curl -LOJ https://archive.softwareheritage.org/api/1/vault/git-bare/swh:1:*/raw/
        Then to import the repository in the current directory, use: :: $ tar -xf path/to/swh_1_*.git.tar
        $ git clone swh:1:*.git new_repository (replace swh:1:* with the SWHID of the requested revision
        or snapshot). This will create a directory called new_repository, which is a git repository containing
        the requested objects.'
