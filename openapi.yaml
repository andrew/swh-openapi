  /api/1/snapshot/{snapshot_id}/:
    get:
      operationId: api-1-snapshot
      summary: Get information about a snapshot in the archive
      description: Get information about a snapshot in the archive. A snapshot is a set of named branches,
        which are pointers to objects at any level of the Software Heritage DAG. It represents a full
        picture of an origin at a given time. As well as pointing to other objects in the Software Heritage
        DAG, branches can also be aliases, in which case their target is the name of another branch in
        the same snapshot, or dangling, in which case the target is unknown. A snapshot identifier is
        a salted sha1. See swh.model.git_objects.snapshot_git_object in our data model module for details
        about how they are computed.
      tags:
      - Archive
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f]+'
        description: a snapshot identifier
        example: 6a3a2cf0b2b90ce7ae1cf0a221ed68035b686f5a
      - name: branches_from
        in: query
        required: false
        schema:
          type: string
      - name: branches_count
        in: query
        required: false
        schema:
          type: integer
      - name: target_types
        in: query
        required: false
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Snapshot'
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
            Link:
              schema:
                type: string
              description: indicates that a subsequent result page is available and contains the url pointing
                to it
        '400':
          description: an invalid snapshot identifier or invalid query parameters has been provided
        '404':
          description: requested snapshot cannot be found in the archive
      x-swh-doc-route: /api/1/snapshot/
