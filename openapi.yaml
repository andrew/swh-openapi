openapi: 3.1.0
info:
  title: Software Heritage Web API
  version: 2026.09.29
  x-swh-web-version: 0.17.12
  description: Unofficial OpenAPI description of the Software Heritage Web API, generated from swh-web's
    own endpoint documentation.
  license:
    name: CC0-1.0
servers:
- url: https://archive.softwareheritage.org
components:
  schemas:
    AddForgeRequestCreatePost:
      type: object
      properties:
        forge_type:
          type: string
          description: the type of forge
        forge_url:
          type: string
          description: the base URL of the forge
        forge_contact_email:
          type: string
          description: email of an administrator of the forge to contact
        forge_contact_name:
          type: string
          description: the name of the administrator
        forge_contact_comment:
          type: string
          description: to explain how Software Heritage can verify forge administrator info are valid
    Content:
      type: object
      properties:
        checksums:
          type: object
          description: object holding the computed checksum values for the requested content
        data_url:
          type: string
          description: link to /api/1/content/raw/ for downloading the content raw bytes
        filetype_url:
          type: string
          description: link to /api/1/content/filetype/ for getting information about the content MIME
            type
        language_url:
          type: string
          description: link to /api/1/content/language/ for getting information about the programming
            language used in the content
        length:
          type: integer
          description: length of the content in bytes
        license_url:
          type: string
          description: link to /api/1/content/license/ for getting information about the license of the
            content
        swhid:
          type: string
          description: the SoftWare Hash IDentifier of the content
    ContentFiletype:
      type: object
      properties:
        content_url:
          type: object
          description: link to /api/1/content/ for getting information about the content
        encoding:
          type: string
          description: the detected content encoding
        id:
          type: string
          description: the sha1 identifier of the content
        mimetype:
          type: string
          description: the detected MIME type of the content
        tool:
          type: object
          description: information about the tool used to detect the content filetype
    ContentLanguage:
      type: object
      properties:
        content_url:
          type: object
          description: link to /api/1/content/ for getting information about the content
        id:
          type: string
          description: the sha1 identifier of the content
        lang:
          type: string
          description: the detected programming language if any
        tool:
          type: object
          description: information about the tool used to detect the programming language
    ContentLicense:
      type: object
      properties:
        content_url:
          type: object
          description: link to /api/1/content/ for getting information about the content
        id:
          type: string
          description: the sha1 identifier of the content
        licenses:
          type: array
          items: {}
          description: array of strings containing the detected license names
        tool:
          type: object
          description: information about the tool used to detect the license
    Directory:
      type: object
      properties:
        checksums:
          type: object
          description: object holding the computed checksum values for a directory entry (only for file
            entries)
        dir_id:
          type: string
          description: sha1_git identifier of the requested directory
        length:
          type: integer
          description: length of a directory entry in bytes (only for file entries) for getting information
            about the content MIME type
        name:
          type: string
          description: the directory entry name
        perms:
          type: integer
          description: permissions for the directory entry
        target:
          type: string
          description: sha1_git identifier of the directory entry
        target_url:
          type: string
          description: link to /api/1/content/ or /api/1/directory/ depending on the directory entry type
        type:
          type: string
          description: the type of the directory entry, can be either dir, file or rev
    ExtidTarget:
      type: object
      properties:
        extid_type:
          type: string
          description: the type of the external identifier
        extid:
          type: string
          description: the value of the external identifier
        target:
          type: string
          description: the SWHID of the archived object targeted by the external identifier
        target_url:
          type: string
          description: URL to browse the targeted archived object
        extid_version:
          type: integer
          description: the version of the external identifier
    ExtrinsicMetadataOrigin:
      type: object
      description: Extrinsic metadata for the origin, as a JSON-LD/CodeMeta object.
      additionalProperties: true
    IntrinsicMetadataOrigin:
      type: object
      description: Intrinsic metadata for the origin, as a JSON-LD/CodeMeta object.
      additionalProperties: true
    KnownPost:
      type: object
      properties:
        <swhid>:
          type: object
          description: 'an object whose keys are input SWHIDs and values objects with the following keys:
            * known (bool): whether the object was found'
    OriginGet:
      type: object
      properties:
        origin_visits_url:
          type: string
          description: link to in order to get information about the visits for that origin
        url:
          type: string
          description: the origin canonical url
        metadata_authorities_url:
          type: string
          description: link to /api/1/raw-extrinsic-metadata/swhid/authorities/ to get the list of metadata
            authorities providing extrinsic metadata on this origin (and, indirectly, to the origin's
            extrinsic metadata itself)
        visit_types:
          type: array
          items: {}
          description: set of visit types for that origin
    OriginMetadataSearch:
      type: object
      properties:
        origin_visits_url:
          type: string
          description: link to in order to get information about the visits for that origin
        url:
          type: string
          description: the origin canonical url
        metadata_authorities_url:
          type: string
          description: link to /api/1/raw-extrinsic-metadata/swhid/authorities/ to get the list of metadata
            authorities providing extrinsic metadata on this origin (and, indirectly, to the origin's
            extrinsic metadata itself)
    OriginSave:
      type: object
      properties:
        id:
          type: integer
          description: the save request identifier
        request_url:
          type: string
          description: Web API URL to follow up on that request
        origin_url:
          type: string
          description: the url of the origin to save
        visit_type:
          type: string
          description: the type of visit to perform
        save_request_date:
          type: string
          description: the date (in iso format) the save request was issued
        save_request_status:
          type: string
          description: the status of the save request, either accepted, rejected or pending
        save_task_status:
          type: string
          description: the status of the origin saving task, either not created, pending, scheduled, running,
            succeeded or failed
        visit_date:
          type: string
          description: the date (in iso format) of the visit if a visit occurred, null otherwise.
        visit_status:
          type: string
          description: the status of the visit, either full, partial, not_found or failed if a visit occurred,
            null otherwise.
        note:
          type: string
          description: optional note giving details about the save request, for instance why it has been
            rejected
        snapshot_swhid:
          type: string
          description: SWHID of snapshot associated to the visit (null if it is missing or unknown)
        snapshot_url:
          type: string
          description: Web API URL to retrieve snapshot data
        from_webhook:
          type: boolean
          description: indicates if the save request was created from a popular forge webhook receiver
            (see /api/1/origin/save/webhook/github/ for instance)
        webhook_origin:
          type: string
          description: indicates which forge type sent the webhook, currently the supported types are:bitbucket,
            forgejo, gitea, github, gitlab, gogs, and sourceforge
    OriginSaveBulkPost:
      type: object
      properties:
        status:
          type: string
          description: either accepted or rejected
        reason:
          type: string
          description: details about why a request got rejected
        request_id:
          type: string
          description: request identifier (only when it its accepted)
        rejected_origins:
          type: array
          items: {}
          description: list of rejected origins and details about the reasons (only when the request is
            rejected)
    OriginSaveBulkRequest:
      type: object
      properties:
        origin_url:
          type: string
          description: URL of submitted origin
        visit_type:
          type: string
          description: visit type for the origin
        status:
          type: string
          description: submitted origin status, either pending, accepted or rejected
        last_scheduling_date:
          type: string
          format: date-time
          description: ISO8601/RFC3339 representation of the last date (in UTC) when the origin was scheduled
            for loading into the archive, null if the origin got rejected
        last_visit_date:
          type: string
          format: date-time
          description: ISO8601/RFC3339 representation of the last date (in UTC) when the origin was visited
            by Software Heritage, null if the origin got rejected or was not visited yet
        last_visit_status:
          type: string
          description: last visit status for the origin, either successful or failed, null if the origin
            got rejected or was not visited yet
        last_snapshot_swhid:
          type: string
          description: last produced snapshot SWHID associated to the visit, null if the origin got rejected
            or was not visited yet
        rejection_reason:
          type: string
          description: if the origin got rejected gives more details about it
        browse_url:
          type: string
          description: URL to browse the submitted origin if it got accepted and loaded into the archive,
            null if the origin got rejected or was not visited yet
    OriginSaveBulkRequests:
      type: object
      properties:
        request_id:
          type: string
          description: UUID identifier of the request
        request_date:
          type: string
          format: date-time
          description: the date the request was submitted
        request_info_url:
          type: string
          description: URL to get detailed info about the request
    OriginSaveWebhookBitbucketPost:
      type: object
      properties:
        id:
          type: integer
          description: the save request identifier
        request_url:
          type: string
          description: Web API URL to follow up on that request
        origin_url:
          type: string
          description: the url of the origin to save
        visit_type:
          type: string
          description: the type of visit to perform
        save_request_date:
          type: string
          description: the date (in iso format) the save request was issued
        save_request_status:
          type: string
          description: the status of the save request, either accepted, rejected or pending
        save_task_status:
          type: string
          description: the status of the origin saving task, either not created, pending, scheduled, running,
            succeeded or failed
        save_task_next_run:
          type: string
          description: the date and time from which the request is executed
    OriginSearch:
      type: object
      properties:
        origin_visits_url:
          type: string
          description: link to in order to get information about the visits for that origin
        url:
          type: string
          description: the origin canonical url
        metadata_authorities_url:
          type: string
          description: link to /api/1/raw-extrinsic-metadata/swhid/authorities/ to get the list of metadata
            authorities providing extrinsic metadata on this origin (and, indirectly, to the origin's
            extrinsic metadata itself)
        has_visits:
          type: boolean
          description: indicates if Software Heritage made at least one full visit of the origin
        nb_visits:
          type: integer
          description: the total number of visits for the origin
        last_visit_date:
          type: string
          description: ISO8601/RFC3339 representation of the last visit date (in UTC)
        last_eventful_visit_date:
          type: string
          description: ISO8601/RFC3339 representation of the last eventful_visit date (in UTC)
        snapshot_id:
          type: string
          description: identifier of the last snapshot for the origin
    OriginVisitLatest:
      type: object
      properties:
        date:
          type: string
          description: ISO8601/RFC3339 representation of the visit date (in UTC)
        origin:
          type: string
          description: the origin canonical url
        origin_url:
          type: string
          description: link to get information about the origin
        snapshot:
          type: string
          description: the snapshot identifier of the visit (may be null if status is not full).
        snapshot_url:
          type: string
          description: link to /api/1/snapshot/ in order to get information about the snapshot of the
            visit (may be null if status is not full).
        status:
          type: string
          description: status of the visit (either full, partial or ongoing)
        type:
          type: string
          description: visit type for the origin
        visit:
          type: integer
          description: the unique identifier of the visit
    OriginVisits:
      type: object
      properties:
        date:
          type: string
          description: ISO8601/RFC3339 representation of the visit date (in UTC)
        origin:
          type: string
          description: the origin canonical url
        origin_url:
          type: string
          description: link to get information about the origin
        snapshot:
          type: string
          description: the snapshot identifier of the visit (may be null if status is not full).
        snapshot_url:
          type: string
          description: link to /api/1/snapshot/ in order to get information about the snapshot of the
            visit (may be null if status is not full).
        status:
          type: string
          description: status of the visit (either full, partial or ongoing)
        type:
          type: string
          description: visit type for the origin
        visit:
          type: integer
          description: the unique identifier of the visit
        id:
          type: integer
          description: the unique identifier of the origin
        origin_visit_url:
          type: string
          description: link to /api/1/origin/visit/ in order to get information about the visit
    RawExtrinsicMetadataOriginAuthorities:
      type: object
      properties:
        type:
          type: string
          description: Type of authority (deposit_client, forge, registry)
        url:
          type: string
          description: Unique IRI identifying the authority
        metadata_list_url:
          type: object
          description: URL to get the list of metadata objects on the given object from this authority
    RawExtrinsicMetadataSwhid:
      type: object
      properties:
        target:
          type: string
          description: SWHID of the object described by this metadata (absent when target is not a core
            SWHID (ie. it does not have type cnt/dir/rev/rel/snp)
        discovery_date:
          type: string
          description: ISO8601/RFC3339 timestamp of the moment this metadata was collected.
        authority:
          type: object
          description: authority this metadata is coming from
        fetcher:
          type: object
          description: tool used to fetch the metadata
        format:
          type: string
          description: short identifier of the format of the metadata
        metadata_url:
          type: string
          description: link to download the metadata "blob" itself
        origin:
          type: string
          description: URL of the origin in which context the metadata is valid, if any
        visit:
          type: integer
          description: identifier of the visit in which context the metadata is valid, if any
        snapshot:
          type: string
          description: SWHID of the snapshot in which context the metadata is valid, if any
        release:
          type: string
          description: SWHID of the release in which context the metadata is valid, if any
        revision:
          type: string
          description: SWHID of the revision in which context the metadata is valid, if any
        path:
          type: string
          description: SWHID of the path in which context is valid if any, relative to a release or revision
            as anchor
        directory:
          type: string
          description: SWHID of the directory in which context the metadata is valid, if any
    RawIntrinsicMetadataCitationOrigin:
      type: object
      properties:
        format:
          type: string
          description: citation format (bibtex, csl)
        content:
          type: string
          description: formatted string representing the software citation content in the expected format
        source_swhid:
          type: string
          description: qualified SWHID for citation metadata source file
        source_url:
          type: string
          description: link to raw bytes of citation metadata source file
    Release:
      type: object
      properties:
        author:
          type: object
          description: information about the author of the release
        date:
          type: string
          description: RFC3339 representation of the release date
        id:
          type: string
          description: the release unique identifier
        message:
          type: string
          description: the message associated to the release
        name:
          type: string
          description: the name of the release
        target:
          type: string
          description: the target identifier of the release
        target_type:
          type: string
          description: the type of the target, can be either release, revision, content, directory
        target_url:
          type: string
          description: a link to the adequate api url based on the target type
    Resolve:
      type: object
      properties:
        browse_url:
          type: string
          description: the url for browsing the pointed object
        metadata:
          type: object
          description: object holding optional parts of the SWHID
        namespace:
          type: string
          description: the SWHID namespace
        object_id:
          type: string
          description: the hash identifier of the pointed object
        object_type:
          type: string
          description: the type of the pointed object
        scheme_version:
          type: integer
          description: the scheme version of the SWHID
    Revision:
      type: object
      properties:
        author:
          type: object
          description: information about the author of the revision
        committer:
          type: object
          description: information about the committer of the revision
        committer_date:
          type: string
          description: RFC3339 representation of the commit date
        date:
          type: string
          description: RFC3339 representation of the revision date
        directory:
          type: string
          description: the unique identifier that revision points to
        directory_url:
          type: string
          description: link to /api/1/directory/ to get information about the directory associated to
            the revision
        id:
          type: string
          description: the revision unique identifier
        merge:
          type: boolean
          description: whether or not the revision corresponds to a merge commit
        message:
          type: string
          description: the message associated to the revision
        parents:
          type: array
          items: {}
          description: the parents of the revision, i.e. the previous revisions that head directly to
            it, each entry of that array contains an unique parent revision identifier but also a link
            to /api/1/revision/ to get more information about it
        type:
          type: string
          description: the type of the revision
    RevisionDirectory:
      type: object
      properties:
        content:
          type: array
          items: {}
          description: directory entries as returned by /api/1/directory/
        path:
          type: string
          description: path of directory from the revision root one
        revision:
          type: string
          description: the unique revision identifier
        type:
          type: string
          description: the type of the directory
    RevisionVulnerabilities:
      type: object
      properties:
        vulnerability:
          type: object
          properties:
            ids:
              type: array
              items: {}
              description: array of strings, each of which is an identifier of the vulnerability
            raw_report:
              type: array
              items: {}
              description: the raw report in OSV format (excluded without ?with_raw_report=yes) See https://ossf.github.io/osv-schema/
                for details
        tool:
          type: object
          properties:
            name:
              type: string
              description: name of the tool used to identify the revision is vulnerable to this vulnerability
            variant:
              type: string
              description: optional human-readable description of the tool's configuration
        source:
          type: object
          properties:
            name:
              type: string
              description: name of the database the vulnerability report comes from
            version:
              type: string
              description: optional date of the database capture
    Snapshot:
      type: object
      properties:
        branches:
          type: object
          description: object containing all branches associated to the snapshot,for each of them the
            associated target type and id are given but also a link to get information about that target
        id:
          type: string
          description: the unique identifier of the snapshot
    StatCounters:
      type: object
      properties:
        content:
          type: integer
          description: current number of content objects (aka files) in the archive
        directory:
          type: integer
          description: current number of directory objects in the archive
        origin:
          type: integer
          description: current number of software origins (an origin is a "place" where code source can
            be found, e.g. a git repository, a tarball, ...) in the archive
        origin_visit:
          type: integer
          description: current number of visits on software origins to fill the archive
        person:
          type: integer
          description: current number of persons (code source authors or committers) in the archive
        release:
          type: integer
          description: current number of releases objects in the archive
        revision:
          type: integer
          description: current number of revision objects (aka commits) in the archive
        skipped_content:
          type: integer
          description: current number of content objects (aka files) which were not inserted in the archive
        snapshot:
          type: integer
          description: current number of snapshot objects (aka set of named branches) in the archive
    VaultFlat:
      type: object
      properties:
        fetch_url:
          type: string
          description: the url from which to download the archive once it has been cooked (see /api/1/vault/flat/raw/)
        progress_message:
          type: string
          description: message describing the cooking task progress
        id:
          type: integer
          description: the cooking task id
        status:
          type: string
          description: the cooking task status (either new, pending, done or failed)
        swhid:
          type: string
          description: the identifier of the object to cook
    VaultGitBare:
      type: object
      properties:
        fetch_url:
          type: string
          description: the url from which to download the archive once it has been cooked (see /api/1/vault/git-bare/raw/)
        progress_message:
          type: string
          description: message describing the cooking task progress
        id:
          type: integer
          description: the cooking task id
        status:
          type: string
          description: the cooking task status (new/pending/done/failed)
        swhid:
          type: string
          description: the identifier of the object to cook
    VaultGitfast:
      type: object
      properties:
        fetch_url:
          type: string
          description: the url from which to download the archive once it has been cooked (see /api/1/vault/gitfast/raw/)
        progress_message:
          type: string
          description: message describing the cooking task progress
        id:
          type: integer
          description: the cooking task id
        status:
          type: string
          description: the cooking task status (new/pending/done/failed)
        swhid:
          type: string
          description: the identifier of the object to cook
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OpenID Connect bearer token, obtained by exchanging an offline token at the Software
        Heritage Keycloak realm. Raises the rate limit; anonymous access is allowed.
security:
- bearerAuth: []
- {}
paths:
  /api/1/add-forge/request/create/:
    post:
      operationId: api-1-add-forge-request-create
      summary: Create a new request to add a forge to the list of those crawled regularly by Software
        Heritage
      description: Create a new request to add a forge to the list of those crawled regularly by Software
        Heritage. That endpoint is not publicly available and requires authentication in order to be able
        to request it.
      tags:
      - Request archival
      parameters:
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '201':
          description: request successfully created
        '400':
          description: missing or invalid field values
        '403':
          description: user not authenticated
        '200':
          description: no error
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
      x-swh-doc-route: /api/1/add-forge/request/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddForgeRequestCreatePost'
          application/yaml:
            schema:
              $ref: '#/components/schemas/AddForgeRequestCreatePost'
  /api/1/add-forge/request/list/:
    get:
      operationId: api-1-add-forge-request-list
      summary: List add forge requests submitted by users
      description: List add forge requests submitted by users.
      tags:
      - Request archival
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: optional page number
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: optional number of elements per page (bounded to 1000)
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: always
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
            Link:
              schema:
                type: string
              description: indicates that a subsequent result page is available and contains the url pointing
                to it
      x-swh-doc-route: /api/1/add-forge/request/list
  /api/1/add-forge/request/{id}/get/:
    get:
      operationId: api-1-add-forge-request-get
      summary: Return all details about an add-forge request
      description: Return all details about an add-forge request.
      tags:
      - Request archival
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]+'
        description: add-forge request identifier
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: request details successfully returned
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
        '400':
          description: request identifier does not exist
      x-swh-doc-route: /api/1/add-forge/request/get
  /api/1/content/{q}/:
    get:
      operationId: api-1-content
      summary: Get information about a content (aka a "blob") object
      description: Get information about a content (aka a "blob") object. In the archive, a content object
        is identified based on checksum values computed using various hashing algorithms.
      tags:
      - Archive
      parameters:
      - name: q
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-z_:]*[0-9a-f]+'
        example: sha1_git:fe95a46679d128ff167b7c55df5d02356c5a1ae1
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
