      x-swh-doc-route: /api/1/origin/save/
  /api/1/origin/save/bulk/:
    post:
      operationId: api-1-save-origin-bulk
      summary: Request the saving of multiple software origins into the archive
      description: 'Request the saving of multiple software origins into the archive. That endpoint enables
        to request the archival of multiple software origins through a POST request containing a list
        of origin URLs and their visit types in its body. The following visit types are supported: bzr,
        cvs, hg, git, svn and tarball-directory. The origins list data can be provided using the following
        content types: * text/csv (default) When using CSV format, first column must contain origin URLs
        and second column the visit types. html <pre><code class="">"https://git.example.org/user/project","git"
        "https://download.example.org/project/source.tar.gz","tarball-directory"</code></pre> To post
        the content of such file to the endpoint, you can use the following curl command. html <pre><code
        class="shell">$ curl -X POST -H "Authorization: Bearer ****" \ -H "Content-Type: text/csv" \ --data-binary
        @/path/to/origins.csv \ https://archive.softwareheritage.org/api/1/origin/save/bulk/</code></pre>
        * application/json When using JSON format, the following schema must be used. html <pre><code
        class="json">[ { "origin_url": "https://git.example.org/user/project", "visit_type": "git" },
        { "origin_url": "https://download.example.org/project/source.tar.gz", "visit_type": "tarball-directory"
        } ]</code></pre> To post the content of such file to the endpoint, you can use the following curl
        command. html <pre><code class="shell">$ curl -X POST -H "Authorization: Bearer ****" \ -H "Content-Type:
        application/json" \ --data-binary @/path/to/origins.json \ https://archive.softwareheritage.org/api/1/origin/save/bulk/</code></pre>
        * application/yaml When using YAML format, the following schema must be used. html <pre><code
        class="yaml">- origin_url: https://git.example.org/user/project visit_type: git - origin_url:
        https://download.example.org/project/source.tar.gz visit_type: tarball-directory</code></pre>
        To post the content of such file to the endpoint, you can use the following curl command. html
        <pre><code class="shell">$ curl -X POST -H "Authorization: Bearer ****" \ -H "Content-Type: application/yaml"
        \ --data-binary @/path/to/origins.yaml \ https://archive.softwareheritage.org/api/1/origin/save/bulk/</code></pre>
        Once received, origins data are checked for correctness by validating URLs and verifying if visit
        types are supported. A request cannot be accepted if at least one origin is not valid. All origins
        with invalid format will be reported in the rejected request response. That endpoint is not publicly
        available and requires authentication and special user permission in order to request it.'
      tags:
      - Request archival
      parameters:
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        description: the requested response content type, either application/json (default) or application/yaml
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        description: the content type of posted data, either text/csv (default), application/json or application/yaml
      responses:
        '200':
          description: no error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginSaveBulkPost'
            application/yaml:
              schema:
                $ref: '#/components/schemas/OriginSaveBulkPost'
          headers:
            Content-Type:
              schema:
                type: string
              description: this depends on Accept header of request
        '400':
          description: provided origins data are not valid
        '401':
          description: request is not authenticated
        '403':
          description: user does not have permission to query the endpoint
        '415':
          description: payload format is not supported
      x-swh-doc-route: /api/1/origin/save/bulk/
